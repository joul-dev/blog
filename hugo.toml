[params.homeInfoParams]
Title = "Hey, I'm Joul 👋"
Content = """
I run three connected AI products: **[gen-image.com](https://gen-image.com)** (B2C image & video generation), **[imference.com](https://imference.com)** (multi-model inference API), and **[Runqy](https://runqy.com)** (open-source Go task queue powering both).

I'm more operator than engineer — I ship fast with AI assistance and share what that actually looks like here: GPU economics, spot-instance orchestration, moderation at scale, and running a profitable AI business without a big team.
"""

